<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeAI Soft - Train and Deploy Enquiry Form</title>
  <meta name="description" content="ZeAI Soft train and deploy enquiry form.">
  <link rel="stylesheet" href="styles.css?v=20260618-form-chrome">
</head>
<body class="form-loading" data-form-category="train_deploy_enquiry">
  <script>
    (() => {
      const category = new URLSearchParams(window.location.search).get("category");
      const allowed = new Set(["train_deploy_enquiry", "student_registration", "launchpad_purchase", "mentor_registration", "hiring_application", "event_registration", "campus_ambassador"]);
      if (allowed.has(category)) document.body.dataset.formCategory = category;
    })();
  </script>
  <header class="form-page-header" aria-label="Form page controls">
    <a class="form-logo" href="../index.html" aria-label="Jenovate home">
      <img src="../image/logo/logonew.png" alt="Jenovate" onerror="this.onerror=null;this.src='../assets/img/logo/favicon.png';">
    </a>
    <button class="page-close-form" type="button" data-close-form aria-label="Close page">&times;</button>
  </header>
  <main class="app-shell" role="dialog" aria-modal="true" aria-labelledby="formTitle">
    <section class="hero-panel">
      <div class="hero-copy">
        <h1 id="formTitle" data-current-title>ZeAI Soft - Train and Deploy Enquiry Form</h1>
        <p data-current-description>Please complete all fields to submit your enquiry request</p>
      </div>
      <button class="close-form" type="button" data-close-form aria-label="Close form">&times;</button>
    </section>

    <section class="form-panel" aria-label="Dynamic form builder">
      <div class="category-bar">
        <label for="categorySelect">Choose category</label>
        <select id="categorySelect"></select>
      </div>

      <div class="progress-wrap">
        <div class="progress-label">
          <span data-step-label>Step 1</span>
          <strong data-progress-percent>0%</strong>
        </div>
        <div class="progress-track"><span data-progress-bar></span></div>
      </div>

      <form id="dynamicForm" novalidate>
        <div class="form-grid" data-form-fields></div>
        <div class="form-actions">
          <button class="ghost-btn" type="button" data-prev-step hidden>Back</button>
          <button class="primary-btn" type="button" data-next-step>Next</button>
          <button class="primary-btn" type="submit" data-submit-form hidden>
            <span class="spinner" aria-hidden="true"></span>
            <b>Submit</b>
          </button>
        </div>
      </form>

      <div class="status" data-status role="status" aria-live="polite"></div>
    </section>
  </main>

  <script src="formEndpoints.js?v=20260618-form-chrome"></script>
  <script src="app.js?v=20260618-form-chrome"></script>
</body>
</html>
