[functions.admin-save-user]
verify_jwt = false

[functions.course-purchase]
verify_jwt = false

[auth]
site_url = "https://jenovate.in"
additional_redirect_urls = ["https://jenovate.in", "http://127.0.0.1:4173", "http://localhost:4173"]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
