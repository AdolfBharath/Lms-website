<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Login - Jenovate</title>
  <link rel="stylesheet" href="lms-premium.css?v=20260522-ui-stability" />
  <link rel="stylesheet" href="login.css?v=20260723-login-layout" />
</head>
<body>
  <div class="login-container">
    <div class="login-left">
      <div class="logo-container">
        <a href="index.html">
          <img src="image/logo/logonew.png" alt="Jenovate Logo" class="logo-img" />
        </a>
      </div>
      <img src="image/login/loginimg.webp" alt="Learn Engage Succeed" class="illustration-img" />
    </div>
    <div class="login-right">
      <div class="login-form-container">
        <h1 class="welcome-title">Welcome</h1>
        <p class="welcome-subtitle">Login with Email</p>
        
        <form class="login-form" action="#" method="POST">
          <div class="form-group">
            <label for="email">EMAIL</label>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg></span>
              <input type="email" id="email" placeholder="you@example.com" required />
            </div>
          </div>
          
          <div class="form-group">
            <div class="label-row">
              <label for="password">PASSWORD</label>
              <a href="#" class="forgot-password">Forgot your password?</a>
            </div>
            <div class="input-wrapper">
              <span class="input-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
              <input type="password" id="password" placeholder="Password" required />
              <button class="toggle-password" type="button" onclick="togglePasswordVisibility()" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          
          <button type="submit" class="submit-btn">LOGIN</button>
          <p class="login-error" id="loginError" role="alert"></p>
          <p class="join-account">
            Don't have an account?
            <a href="form-engine/index.html?category=student_registration">Join Now</a>
          </p>
        </form>
      </div>
    </div>
  </div>

  <!-- Supabase CDN and Config -->
  <script src="assets/vendor/supabase-2.49.4.js"></script>
  <script src="supabase-config.js?v=20260618-signed-storage"></script>
  <script src="auth-session.js?v=20260715-fast-auth"></script>
  
  <script>
    const APP_SESSION_KEY = 'jenovateCurrentUser';
    const ADMIN_SESSION_KEY = 'jenovateAdminSession';
    const MENTOR_SESSION_KEY = 'jenovateMentorSession';
    const STUDENT_SESSION_KEY = 'jenovateStudentSession';
    const PREV_PAGE_KEY = 'jenovatePrevPage';

    document.addEventListener('DOMContentLoaded', () => {
      initializeLoginBackNavigation();
    });

    function togglePasswordVisibility() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.querySelector('.toggle-password');
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.setAttribute('aria-label', 'Hide password');
      } else {
        passwordInput.type = 'password';
        toggleIcon.setAttribute('aria-label', 'Show password');
      }
    }

    document.querySelector('.login-form').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const submitBtn = document.querySelector('.submit-btn');
      const errorBox = document.getElementById('loginError');
      
      errorBox.textContent = '';
      submitBtn.textContent = 'LOGGING IN...';
      submitBtn.disabled = true;

      try {
        let profile = await verifyLogin(email, password);
        if (!profile) {
          throw new Error('Invalid email or password.');
        }

        const sessionProfile = {
          id: profile.id,
          name: profile.name || profile.username || profile.email,
          email: profile.email,
          role: (profile.role || 'student').toLowerCase(),
          username: profile.username || '',
          phone: profile.phone || '',
          batch_id: profile.batch_id || '',
          course_ids: Array.isArray(profile.course_ids) ? profile.course_ids : [],
          coins: profile.coins || 0,
          streak_count: profile.streak_count || 0,
          last_active_date: profile.last_active_date || '',
          auth_mode: 'supabase_auth'
        };

        // Use sessionStorage so the session stays in this browser tab until logout or tab close.
        sessionStorage.setItem(APP_SESSION_KEY, JSON.stringify(sessionProfile));
        sessionStorage.removeItem(ADMIN_SESSION_KEY);
        sessionStorage.removeItem(MENTOR_SESSION_KEY);
        sessionStorage.removeItem(STUDENT_SESSION_KEY);

        const roleSessionKey = {
          admin: ADMIN_SESSION_KEY,
          mentor: MENTOR_SESSION_KEY,
          student: STUDENT_SESSION_KEY
        }[sessionProfile.role];
        if (roleSessionKey) {
          sessionStorage.setItem(roleSessionKey, JSON.stringify(sessionProfile));
        }

        const requestedRoute = window.JenovateAuth?.requestedRoute?.();
        const roleRoute = window.JenovateAuth?.routeFor?.(sessionProfile);
        window.location.replace(requestedRoute && requestedRoute === roleRoute ? requestedRoute : roleRoute || 'index.html');
      } catch (error) {
        errorBox.textContent = error.message || 'Login failed. Please try again.';
        submitBtn.textContent = 'LOGIN';
        submitBtn.disabled = false;
      }
    });

    async function verifyLogin(email, password) {
      return window.JenovateAuth.signInWithPassword(email, password);
    }

    document.querySelector('.forgot-password')?.addEventListener('click', async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const errorBox = document.getElementById('loginError');
      if (!email) {
        errorBox.textContent = 'Enter your email first, then request a password reset.';
        return;
      }
      try {
        const redirectTo = `${window.location.origin}${window.location.pathname.replace(/login\.html$/i, 'reset-password.html')}`;
        const { error } = await window.getSupabaseClient().auth.resetPasswordForEmail(email, { redirectTo });
        if (error) throw error;
        errorBox.textContent = 'Password reset link sent. Please check your email.';
      } catch (error) {
        errorBox.textContent = error.message || 'Unable to send reset email.';
      }
    });

    function initializeLoginBackNavigation() {
      if (!window.history?.pushState) return;
      history.replaceState({ loginView: true }, '', window.location.href);
      history.pushState({ loginGuard: true }, '', window.location.href);
      window.addEventListener('popstate', () => {
        window.location.replace('index.html');
      });
    }
  </script>
</body>
</html>
