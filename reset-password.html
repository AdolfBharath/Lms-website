<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Reset Password - Jenovate</title>
  <link rel="stylesheet" href="lms-premium.css?v=20260522-ui-stability" />
  <link rel="stylesheet" href="login.css?v=20260623-login-image-right-nudge" />
</head>
<body>
  <div class="login-container">
    <div class="login-left">
      <div class="logo-container">
        <a href="index.html"><img src="image/logo/logonew.png" alt="Jenovate Logo" class="logo-img" /></a>
      </div>
      <img src="image/login/loginimg.webp" alt="Learn Engage Succeed" class="illustration-img" />
    </div>
    <div class="login-right">
      <div class="login-form-container">
        <h1 class="welcome-title">Reset Password</h1>
        <p class="welcome-subtitle">Create a secure new password</p>
        <form class="login-form" id="resetPasswordForm">
          <div class="form-group">
            <label for="newPassword">NEW PASSWORD</label>
            <div class="input-wrapper">
              <input type="password" id="newPassword" placeholder="At least 8 characters" minlength="8" required />
            </div>
          </div>
          <div class="form-group">
            <label for="confirmPassword">CONFIRM PASSWORD</label>
            <div class="input-wrapper">
              <input type="password" id="confirmPassword" placeholder="Repeat password" minlength="8" required />
            </div>
          </div>
          <button type="submit" class="submit-btn">UPDATE PASSWORD</button>
          <p class="login-error" id="resetMessage" role="alert"></p>
          <p class="join-account"><a href="login.html">Back to login</a></p>
        </form>
      </div>
    </div>
  </div>

  <script src="assets/vendor/supabase-2.49.4.js"></script>
  <script src="supabase-config.js?v=20260618-signed-storage"></script>
  <script src="auth-session.js?v=20260618-auth-migration-fix"></script>
  <script>
    document.getElementById("resetPasswordForm").addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("newPassword").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      const message = document.getElementById("resetMessage");
      const button = event.currentTarget.querySelector("button[type='submit']");
      message.textContent = "";
      if (password !== confirmPassword) {
        message.textContent = "Passwords do not match.";
        return;
      }
      button.disabled = true;
      button.textContent = "UPDATING...";
      try {
        const { error } = await window.getSupabaseClient().auth.updateUser({ password });
        if (error) throw error;
        message.textContent = "Password updated. Redirecting to login...";
        await window.JenovateAuth?.signOut?.();
        window.setTimeout(() => window.location.replace("login.html?reset=success"), 900);
      } catch (error) {
        message.textContent = error.message || "Unable to update password. Open the reset link again.";
        button.disabled = false;
        button.textContent = "UPDATE PASSWORD";
      }
    });
  </script>
</body>
</html>
